<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Kinetix Advanced Crypto Trading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #00ff88;
            --secondary-color: #0a0a0a;
            --accent-color: #7b61ff;
            --background-color: #000000;
            --card-color: #111111;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
            --success-color: #00ff88;
            --danger-color: #ff3860;
            --border-radius: 8px;
            --shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--background-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 255, 136, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(123, 97, 255, 0.08) 0%, transparent 40%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 18px 0;
            background-color: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            transition: var(--transition);
        }

        .logo i {
            font-size: 26px;
            color: var(--primary-color);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--border-radius);
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.03);
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
            background: rgba(0, 255, 136, 0.06);
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .auth-card {
            background-color: var(--card-color);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Auth Tabs */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--card-border);
            background-color: rgba(10, 10, 10, 0.5);
        }

        .auth-tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .auth-tab.active {
            color: var(--primary-color);
            background-color: var(--card-color);
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary-color);
        }

        /* Form */
        .auth-form {
            padding: 32px 28px;
        }

        .form-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .form-header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-color);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-secondary);
            font-size: 14px;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 16px;
            transition: var(--transition);
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.2);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }

        .toggle-password:hover {
            color: var(--text-color);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .remember-me {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            margin-top: 2px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .remember-me label {
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .remember-me label a {
            color: var(--primary-color);
            text-decoration: underline;
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--primary-color);
            color: var(--background-color);
            border: none;
            border-radius: var(--border-radius);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-submit:hover {
            background-color: #00cc6d;
            transform: translateY(-1px);
        }

        .auth-divider {
            text-align: center;
            margin: 22px 0;
            position: relative;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: var(--card-border);
        }

        .auth-divider::before { left: 0; }
        .auth-divider::after { right: 0; }

        .social-auth {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
        }

        .social-btn {
            flex: 1;
            padding: 11px;
            border: 1px solid var(--card-border);
            border-radius: var(--border-radius);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-color);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .social-btn:hover {
            background-color: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .auth-switch {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .auth-switch a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            padding: 20px 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--card-border);
        }

        /* Responsive Breakpoints */
        @media (max-width: 576px) {
            .header-container {
                width: 92%;
            }

            .logo {
                font-size: 20px;
            }

            .logo i {
                font-size: 22px;
            }

            .back-link {
                padding: 6px 12px;
                font-size: 13px;
            }

            main {
                padding: 20px 12px;
            }

            .auth-card {
                border-radius: 10px;
            }

            .auth-form {
                padding: 24px 18px;
            }

            .form-header h1 {
                font-size: 20px;
            }

            .form-header p {
                font-size: 13px;
            }

            .social-auth {
                flex-direction: column;
                gap: 10px;
            }

            .social-btn {
                padding: 12px;
            }
        }

        @media (max-width: 380px) {
            .auth-form {
                padding: 20px 14px;
            }

            .form-group input {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <i class="fas fa-chart-line"></i>
                Kinetix
            </a>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
        </div>
    </header>

    <!-- Main Auth Card -->
    <main>
        <div class="auth-card">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabSignup">Sign Up</button>
                <button class="auth-tab" id="tabLogin">Log In</button>
            </div>

            <!-- Sign Up Form -->
            <form class="auth-form" id="signupForm">
                <div class="form-header">
                    <h1>Create your account</h1>
                    <p>Start trading cryptocurrencies with low fees</p>
                </div>

                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="signupName" placeholder="Enter your full name" required autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="signupEmail" placeholder="Enter your email address" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="signupPassword" placeholder="Create a password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="agreeTerms" required>
                        <label for="agreeTerms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>
                </div>

                <button type="submit" class="auth-submit">Create Account</button>

                <div class="auth-divider">or continue with</div>

                <div class="social-auth">
                    <button type="button" class="social-btn">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="social-btn">
                        <i class="fab fa-apple"></i> Apple
                    </button>
                </div>

                <div class="auth-switch">
                    Already have an account? <a href="#" id="switchToLogin">Log in</a>
                </div>
            </form>

            <!-- Log In Form -->
            <form class="auth-form" id="loginForm" style="display: none;">
                <div class="form-header">
                    <h1>Welcome back</h1>
                    <p>Log in to access your Kinetix dashboard</p>
                </div>

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="auth-submit">Log In</button>

                <div class="auth-divider">or continue with</div>

                <div class="social-auth">
                    <button type="button" class="social-btn">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="social-btn">
                        <i class="fab fa-apple"></i> Apple
                    </button>
                </div>

                <div class="auth-switch">
                    Don't have an account? <a href="#" id="switchToSignup">Sign up</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Kinetix. All rights reserved.</p>
    </footer>

    <script>
        const tabSignup = document.getElementById('tabSignup');
        const tabLogin = document.getElementById('tabLogin');
        const signupForm = document.getElementById('signupForm');
        const loginForm = document.getElementById('loginForm');
        const switchToLogin = document.getElementById('switchToLogin');
        const switchToSignup = document.getElementById('switchToSignup');

        function showSignup() {
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
            signupForm.style.display = 'block';
            loginForm.style.display = 'none';
        }

        function showLogin() {
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
        }

        tabSignup.addEventListener('click', showSignup);
        tabLogin.addEventListener('click', showLogin);
        switchToLogin.addEventListener('click', (e) => { e.preventDefault(); showLogin(); });
        switchToSignup.addEventListener('click', (e) => { e.preventDefault(); showSignup(); });

        // Show/Hide password toggles
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.getAttribute('data-target');
                const input = document.getElementById(targetId);
                const icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        });

        // Form submits
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (pass !== confirm) {
                alert('Passwords do not match!');
                return;
            }
            alert('Account created successfully! Welcome to Kinetix.');
            window.location.href = 'index.html';
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Logged in successfully!');
            window.location.href = 'index.html';
        });

        // Check hash
        if (window.location.hash === '#login') {
            showLogin();
        }
    </script>
</body>
</html>
